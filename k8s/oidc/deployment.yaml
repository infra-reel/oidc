apiVersion: v1
kind: Namespace
metadata:
  name: oidc
---
# NFS上にDexの永続データ(署名鍵・リフレッシュトークン等のstorage backend)を置く
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oidc-data
  namespace: oidc
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: nfs-pvc
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oidc-server
  namespace: oidc
  labels:
    app: oidc-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oidc-server
  template:
    metadata:
      labels:
        app: oidc-server
      annotations:
        # Vault Agent Injector: Pod起動時にVaultからシークレットを取得し
        # /vault/secrets/ 配下にファイルとして展開する
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "oidc-server"
        # config.yaml自体をVaultからレンダリングする。
        # staticClientsはVaultのclients_jsonフィールド(JSON配列)から動的に生成されるため、
        # console管理画面からクライアントを追加/削除するとここが更新され、
        # Vault Agentが自動で再レンダリングする(Podの再起動は別途必要)。
        vault.hashicorp.com/agent-inject-secret-config.yaml: "secret/data/oidc/server"
        vault.hashicorp.com/agent-inject-template-config.yaml: |
          {{- with secret "secret/data/oidc/server" -}}
          issuer: https://oidc.reeldev.jp

          storage:
            type: sqlite3
            config:
              file: /var/dex/data/dex.db

          web:
            http: 0.0.0.0:5556

          oauth2:
            skipApprovalScreen: true

          connectors:
            - type: oauth
              id: discord
              name: Discord
              config:
                clientID: {{ .Data.data.discord_client_id | toJSON }}
                clientSecret: {{ .Data.data.discord_client_secret | toJSON }}
                redirectURI: https://oidc.reeldev.jp/callback
                authorizationURL: https://discord.com/api/oauth2/authorize
                tokenURL: https://discord.com/api/oauth2/token
                userInfoURL: https://discord.com/api/users/@me
                scopes:
                  - identify
                  - email
                userIDKey: id
                userNameKey: username

          staticClients:
          {{- range (.Data.data.clients_json | parseJSON) }}
            - id: {{ .id }}
              name: {{ .name | toJSON }}
              secret: {{ .secret | toJSON }}
              redirectURIs:
          {{- range .redirectURIs }}
                - {{ . | toJSON }}
          {{- end }}
          {{- end }}
          {{- end -}}
    spec:
      # 「node worker / tier: prod」に展開する指定
      nodeSelector:
        role: worker
        tier: prod
      containers:
        - name: oidc-server
          image: ghcr.io/infra-reel/oidc-server:latest   # ArgoCD Image Updaterが自動更新
          ports:
            - containerPort: 5556
          envFrom:
            - secretRef:
                name: oidc-server-static-env
                optional: true
          command:
            - sh
            - -c
            - |
              exec /usr/local/bin/dex serve /vault/secrets/config.yaml
          volumeMounts:
            - name: data
              mountPath: /var/dex/data
          readinessProbe:
            httpGet: { path: /healthz, port: 5556 }
          livenessProbe:
            httpGet: { path: /healthz, port: 5556 }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: oidc-data
---
apiVersion: v1
kind: Service
metadata:
  name: oidc-server
  namespace: oidc
spec:
  selector:
    app: oidc-server
  ports:
    - port: 80
      targetPort: 5556
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oidc-server
  namespace: oidc
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    cert-manager.io/issue-temporary-certificate: "true"
    acme.cert-manager.io/http01-edit-in-place: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["oidc.reeldev.jp"]
      secretName: oidc-tls
  rules:
    - host: oidc.reeldev.jp
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oidc-server
                port: { number: 80 }
